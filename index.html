<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Meu Amor ❤️</title>
    <style>
        body {
            margin: 0;
            font-family: 'Georgia', serif;
            color: #fff;
            line-height: 1.8;
            background: url('fundo.png') no-repeat center center fixed;
            background-size: cover;
        }

        .blog-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(30, 20, 25, 0.82);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        header {
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 25px;
            margin-bottom: 35px;
        }

        header h1 {
            margin: 0;
            font-size: 2.4rem;
            color: #ff8da1;
            font-weight: normal;
        }

        header p {
            color: #ddd;
            font-style: italic;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .heart-icon {
            font-size: 1.8rem;
            color: #ff4d6d;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .post {
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            border-left: 3px solid #ff4d6d;
        }

        .post-title {
            font-size: 1.5rem;
            color: #fff;
            margin: 0 0 5px 0;
        }

        .post-date {
            font-size: 0.85rem;
            color: #ffb3c1;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .post-content {
            font-size: 1.1rem;
            color: #f0f0f0;
        }
    </style>
</head>
<body>

    <div class="blog-container">
        
        <header>
            <div class="heart-icon">❤️</div>
            <h1>Nosso Espaço</h1>
            <p>Guardando cada pedacinho da nossa história.</p>
        </header>

        <main>
            <article class="post">
                <h2 class="post-title">O começo de tudo</h2>
                <div class="post-date">❤️ 16 de Agosto de 2026</div>
                <div class="post-content">
                    <p>Escreva aqui a sua primeira carta ou texto para ela. Você pode contar como se conheceram, declarar o seu amor ou deixar uma mensagem especial que vai ficar guardada na internet para sempre.</p>
                </div>
            </article>
        </main>

    </div>

</body>
</html>
